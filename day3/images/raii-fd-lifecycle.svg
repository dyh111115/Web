<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">FdGuard 与文件描述符生命周期</text>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="28" y="105" width="165" height="85" rx="15" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="110" y="138" font-size="17" font-weight="700" fill="#0c4a6e">创建对象</text><text x="110" y="166" font-size="14" fill="#334155">FdGuard file(...)</text>
    <rect x="220" y="105" width="165" height="85" rx="15" fill="#dcfce7" stroke="#4ade80"/>
    <text x="302" y="138" font-size="17" font-weight="700" fill="#166534">构造函数</text><text x="302" y="166" font-size="14" fill="#334155">open()</text>
    <rect x="412" y="105" width="165" height="85" rx="15" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="494" y="138" font-size="17" font-weight="700" fill="#92400e">保存 fd</text><text x="494" y="166" font-size="14" fill="#334155">fd_ = 3</text>
    <rect x="604" y="105" width="165" height="85" rx="15" fill="#fce7f3" stroke="#f472b6"/>
    <text x="686" y="138" font-size="17" font-weight="700" fill="#9d174d">使用资源</text><text x="686" y="166" font-size="14" fill="#334155">read / get</text>
    <rect x="796" y="105" width="276" height="85" rx="15" fill="#fee2e2" stroke="#f87171"/>
    <text x="934" y="138" font-size="17" font-weight="700" fill="#991b1b">离开作用域 → 析构函数</text><text x="934" y="166" font-size="14" fill="#334155">close(fd_)</text>
    <line x1="193" y1="147" x2="211" y2="147" stroke="#64748b" stroke-width="3" marker-end="url(#a3)"/>
    <line x1="385" y1="147" x2="403" y2="147" stroke="#64748b" stroke-width="3" marker-end="url(#a3)"/>
    <line x1="577" y1="147" x2="595" y2="147" stroke="#64748b" stroke-width="3" marker-end="url(#a3)"/>
    <line x1="769" y1="147" x2="787" y2="147" stroke="#64748b" stroke-width="3" marker-end="url(#a3)"/>

    <rect x="60" y="242" width="455" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="287" y="277" font-size="19" font-weight="700" fill="#334155">fd 是什么</text>
    <text x="287" y="305" font-size="15" fill="#475569">fd 是操作系统分配的资源编号，不是文件本身。</text>
    <text x="287" y="330" font-size="15" fill="#475569">0/1/2 分别是标准输入、标准输出、标准错误。</text>

    <rect x="560" y="242" width="485" height="112" rx="18" fill="#fff7ed" stroke="#fb923c"/>
    <text x="802" y="277" font-size="19" font-weight="700" fill="#9a3412">close 做了什么</text>
    <text x="802" y="305" font-size="15" fill="#475569">释放 fd 对应的系统资源，编号之后可能被重新使用。</text>
    <text x="802" y="330" font-size="15" fill="#475569">close 后不要再使用原来的 fd。</text>
    <text x="550" y="398" text-anchor="middle" font-size="15" fill="#475569">RAII：构造函数获取资源，析构函数释放资源。</text>
  </g>
</svg>
