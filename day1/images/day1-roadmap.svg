<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <rect width="1080" height="360" fill="#ffffff"/>
  <text x="540" y="45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">Day 1 学习路线</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="35" y="95" width="135" height="92" rx="16" fill="#e0f2fe" stroke="#38bdf8" filter="url(#shadow)"/>
    <text x="102" y="132" font-size="18" font-weight="700" fill="#0c4a6e">Linux 环境</text>
    <text x="102" y="158" font-size="14" fill="#0f172a">WSL / g++</text>

    <rect x="215" y="95" width="135" height="92" rx="16" fill="#dcfce7" stroke="#4ade80" filter="url(#shadow)"/>
    <text x="282" y="132" font-size="18" font-weight="700" fill="#166534">基本语法</text>
    <text x="282" y="158" font-size="14" fill="#0f172a">变量 / 分支 / 循环</text>

    <rect x="395" y="95" width="135" height="92" rx="16" fill="#fef3c7" stroke="#fbbf24" filter="url(#shadow)"/>
    <text x="462" y="132" font-size="18" font-weight="700" fill="#92400e">函数</text>
    <text x="462" y="158" font-size="14" fill="#0f172a">参数 / 返回值</text>

    <rect x="575" y="95" width="145" height="92" rx="16" fill="#fce7f3" stroke="#f472b6" filter="url(#shadow)"/>
    <text x="647" y="132" font-size="18" font-weight="700" fill="#9d174d">多文件程序</text>
    <text x="647" y="158" font-size="14" fill="#0f172a">.h / .cpp / main</text>

    <rect x="765" y="95" width="135" height="92" rx="16" fill="#ede9fe" stroke="#a78bfa" filter="url(#shadow)"/>
    <text x="832" y="132" font-size="18" font-weight="700" fill="#5b21b6">编译链接</text>
    <text x="832" y="158" font-size="14" fill="#0f172a">g++ / undefined ref</text>

    <rect x="945" y="95" width="100" height="92" rx="16" fill="#fee2e2" stroke="#f87171" filter="url(#shadow)"/>
    <text x="995" y="132" font-size="18" font-weight="700" fill="#991b1b">运行验收</text>
    <text x="995" y="158" font-size="14" fill="#0f172a">测试 / 笔记</text>

    <line x1="170" y1="141" x2="206" y2="141" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="350" y1="141" x2="386" y2="141" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="530" y1="141" x2="566" y2="141" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="720" y1="141" x2="756" y2="141" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="900" y1="141" x2="936" y2="141" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="160" y="245" width="760" height="62" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="540" y="272" font-size="17" font-weight="700" fill="#334155">今天的主线</text>
    <text x="540" y="294" font-size="15" fill="#475569">把“输入用户名并输出问候”拆成多个函数，再用 .h/.cpp 组织并通过 g++ 编译运行。</text>
  </g>
</svg>
