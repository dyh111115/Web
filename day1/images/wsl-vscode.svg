<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="490" y="42" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#172033">WSL + VS Code 协作关系</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="38" y="92" width="250" height="185" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="163" y="130" font-size="21" font-weight="700" fill="#0c4a6e">Windows</text>
    <rect x="72" y="153" width="182" height="74" rx="12" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="163" y="183" font-size="18" font-weight="700" fill="#0f172a">VS Code 界面</text>
    <text x="163" y="208" font-size="14" fill="#475569">编辑代码 / 查看文件</text>

    <rect x="392" y="70" width="550" height="250" rx="22" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
    <text x="667" y="108" font-size="21" font-weight="700" fill="#166534">WSL2 Ubuntu</text>
    <rect x="430" y="132" width="148" height="78" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="504" y="161" font-size="16" font-weight="700" fill="#166534">VS Code Server</text>
    <text x="504" y="185" font-size="13" fill="#475569">自动安装并运行</text>
    <rect x="608" y="132" width="148" height="78" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="682" y="161" font-size="16" font-weight="700" fill="#166534">项目文件</text>
    <text x="682" y="185" font-size="13" fill="#475569">~/cpp-learning</text>
    <rect x="786" y="132" width="122" height="78" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="847" y="161" font-size="16" font-weight="700" fill="#166534">终端</text>
    <text x="847" y="185" font-size="13" fill="#475569">Ubuntu Bash</text>
    <rect x="430" y="236" width="478" height="54" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="669" y="260" font-size="16" font-weight="700" fill="#166534">g++ 编译 → ./greet 运行</text>
    <text x="669" y="281" font-size="13" fill="#475569">编译、运行和文件系统都在 Linux 一侧</text>

    <line x1="288" y1="184" x2="383" y2="184" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="335" y="160" font-size="13" fill="#475569">Remote - WSL</text>
    <text x="335" y="214" font-size="13" fill="#475569">code .</text>
    <rect x="255" y="279" width="455" height="38" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="482" y="304" font-size="15" fill="#334155">VS Code 是编辑器，真正的编译与运行发生在 WSL Ubuntu 中。</text>
  </g>
</svg>
